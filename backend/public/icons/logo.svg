<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00C853"/>
      <stop offset="100%" style="stop-color:#007A33"/>
    </linearGradient>
  </defs>

  <!-- Fundo arredondado verde -->
  <rect width="200" height="200" rx="44" ry="44" fill="url(#bg)"/>

  <!-- Bagageiro (caixa quadrada no alto) -->
  <rect x="30" y="52" width="52" height="46" rx="6" ry="6" fill="#ffffff"/>
  <!-- Tampa do bagageiro -->
  <rect x="27" y="48" width="58" height="10" rx="4" ry="4" fill="#ffffff"/>

  <!-- Corpo da moto (Vespa) -->
  <!-- Cupolino/para-brisa -->
  <path d="M115 88 Q130 60 148 68 Q155 72 152 85 Z" fill="#ffffff"/>
  <!-- Corpo principal -->
  <ellipse cx="105" cy="112" rx="48" ry="28" fill="#ffffff"/>
  <!-- Bagageiro traseiro (conexão com caixa) -->
  <rect x="56" y="88" width="20" height="14" rx="3" fill="#ffffff"/>
  <!-- Assento -->
  <ellipse cx="118" cy="88" rx="20" ry="7" fill="#ffffff"/>
  <!-- Guidão -->
  <path d="M148 68 L155 62 M155 62 L160 68" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Roda traseira -->
  <circle cx="70" cy="148" r="22" fill="#ffffff"/>
  <circle cx="70" cy="148" r="10" fill="#00C853"/>
  <circle cx="70" cy="148" r="4" fill="#ffffff"/>

  <!-- Roda dianteira -->
  <circle cx="148" cy="148" r="22" fill="#ffffff"/>
  <circle cx="148" cy="148" r="10" fill="#00C853"/>
  <circle cx="148" cy="148" r="4" fill="#ffffff"/>

  <!-- Chassis (chão da moto) -->
  <path d="M58 140 Q100 128 140 140" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none"/>
</svg>
