name: Build Android APK + AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor dependencies
        working-directory: android-app
        run: npm install

      - name: Add Android platform
        working-directory: android-app
        run: npx cap add android

      - name: Write google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | tr -d '\n' | base64 --decode > android-app/android/app/google-services.json

      - name: Sync Capacitor
        working-directory: android-app
        run: npx cap sync android

      - name: Set app icon
        run: |
          SRC="backend/public/icons/icon-512.png"
          RES="android-app/android/app/src/main/res"
          sudo apt-get install -y imagemagick 2>/dev/null
          convert "$SRC" -resize 48x48   "$RES/mipmap-mdpi/ic_launcher.png"
          convert "$SRC" -resize 72x72   "$RES/mipmap-hdpi/ic_launcher.png"
          convert "$SRC" -resize 96x96   "$RES/mipmap-xhdpi/ic_launcher.png"
          convert "$SRC" -resize 144x144 "$RES/mipmap-xxhdpi/ic_launcher.png"
          convert "$SRC" -resize 192x192 "$RES/mipmap-xxxhdpi/ic_launcher.png"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "$RES/mipmap-$d/ic_launcher.png" "$RES/mipmap-$d/ic_launcher_round.png" 2>/dev/null || true
          done
          convert "$SRC" -resize 432x432 -gravity center -extent 648x648 -background transparent \
            "$RES/drawable/ic_launcher_foreground.png" 2>/dev/null || \
          convert "$SRC" -resize 432x432 -gravity center -extent 648x648 \
            "$RES/drawable/ic_launcher_foreground.png" || true
          convert "$SRC" -resize 81x81   -gravity center -extent 108x108  "$RES/mipmap-mdpi/ic_launcher_foreground.png"   2>/dev/null || true
          convert "$SRC" -resize 121x121 -gravity center -extent 162x162  "$RES/mipmap-hdpi/ic_launcher_foreground.png"   2>/dev/null || true
          convert "$SRC" -resize 162x162 -gravity center -extent 216x216  "$RES/mipmap-xhdpi/ic_launcher_foreground.png"  2>/dev/null || true
          convert "$SRC" -resize 243x243 -gravity center -extent 324x324  "$RES/mipmap-xxhdpi/ic_launcher_foreground.png" 2>/dev/null || true
          convert "$SRC" -resize 324x324 -gravity center -extent 432x432  "$RES/mipmap-xxxhdpi/ic_launcher_foreground.png" 2>/dev/null || true

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android-app/android/app/chegouai.jks

      - name: Set targetSdkVersion to 35 and bump versionCode
        run: |
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 35/' android-app/android/variables.gradle || true
          sed -i 's/targetSdk = .*/targetSdk = 35/' android-app/android/variables.gradle || true
          sed -i 's/versionCode .*/versionCode 7/' android-app/android/app/build.gradle || true
          cat android-app/android/variables.gradle 2>/dev/null || true

      - name: Add location permissions to AndroidManifest
        run: |
          MANIFEST="android-app/android/app/src/main/AndroidManifest.xml"
          grep -q 'ACCESS_FINE_LOCATION' "$MANIFEST" || \
            sed -i 's|<uses-permission android:name="android.permission.INTERNET"|<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.INTERNET"|' "$MANIFEST"
          grep 'LOCATION' "$MANIFEST" || true

      - name: Configure signing in build.gradle
        run: |
          cat >> android-app/android/app/build.gradle << 'EOF'

          android.signingConfigs {
            release {
              storeFile file("chegouai.jks")
              storePassword System.getenv("KEYSTORE_PASSWORD")
              keyAlias System.getenv("KEY_ALIAS")
              keyPassword System.getenv("KEY_PASSWORD")
            }
          }
          android.buildTypes.release.signingConfig = android.signingConfigs.release
          EOF

      - name: Make gradlew executable
        working-directory: android-app/android
        run: chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug

      - name: Build Release AAB (Play Store)
        working-directory: android-app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chegouai-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Upload Release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: chegouai-release-aab
          path: android-app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Delete old release
        run: gh release delete latest --yes 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Chegou Aí — Versão mais recente"
          body: |
            **Instale o app Chegou Aí no Android**

            1. Baixe o arquivo `chegouai.apk` abaixo
            2. Abra o arquivo no celular
            3. Se aparecer aviso de "fonte desconhecida", toque em **Instalar mesmo assim**
          files: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
