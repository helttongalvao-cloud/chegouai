name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor dependencies
        working-directory: android-app
        run: npm install

      - name: Add Android platform
        working-directory: android-app
        run: npx cap add android

      - name: Write google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android-app/android/app/google-services.json

      - name: Sync Capacitor
        working-directory: android-app
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: android-app/android
        run: chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chegouai-debug
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
