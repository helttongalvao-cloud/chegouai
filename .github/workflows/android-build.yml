name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor dependencies
        working-directory: android-app
        run: npm install

      - name: Add Android platform
        working-directory: android-app
        run: npx cap add android

      - name: Write google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | tr -d '\n' | base64 --decode > android-app/android/app/google-services.json

      - name: Set app icon
        run: |
          SRC="backend/public/icons/icon-512.png"
          RES="android-app/android/app/src/main/res"
          convert "$SRC" -resize 48x48   "$RES/mipmap-mdpi/ic_launcher.png"
          convert "$SRC" -resize 72x72   "$RES/mipmap-hdpi/ic_launcher.png"
          convert "$SRC" -resize 96x96   "$RES/mipmap-xhdpi/ic_launcher.png"
          convert "$SRC" -resize 144x144 "$RES/mipmap-xxhdpi/ic_launcher.png"
          convert "$SRC" -resize 192x192 "$RES/mipmap-xxxhdpi/ic_launcher.png"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "$RES/mipmap-$d/ic_launcher.png" "$RES/mipmap-$d/ic_launcher_round.png" 2>/dev/null || true
          done

      - name: Sync Capacitor
        working-directory: android-app
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: android-app/android
        run: chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chegouai-debug
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Delete old release
        run: gh release delete latest --yes 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Chegou Aí — Versão mais recente"
          body: |
            **Instale o app Chegou Aí no Android**

            1. Baixe o arquivo `chegouai.apk` abaixo
            2. Abra o arquivo no celular
            3. Se aparecer aviso de "fonte desconhecida", toque em **Instalar mesmo assim**
          files: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
